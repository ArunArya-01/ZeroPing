name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Check Python syntax
      run: |
        python -m compileall -q data physics notebooks

    - name: Check importable source with flake8
      run: |
        flake8 data physics --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Check code formatting with black
      run: |
        black --check data physics || true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff data physics || true

  test:
    name: Dependency & Import Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate Python imports
      run: |
        python -c "
        import importlib

        modules = [
            'data.loader',
            'physics.openap_baseline',
            'physics.feature_engineering',
            'physics.weather_features',
        ]

        print('Testing current project imports...')
        for module in modules:
            importlib.import_module(module)
            print(f'OK {module}')
        "
    
    - name: Verify project scripts compile
      run: |
        python -m compileall -q data physics notebooks

  security:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install safety
      run: |
        pip install safety
    
    - name: Check dependencies for vulnerabilities
      run: |
        pip install -r requirements.txt
        safety check || true

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify core modules can be loaded
      run: |
        python -c "
        import py_compile
        import importlib

        importlib.import_module('data.loader')
        print('OK data.loader loaded successfully')

        importlib.import_module('physics.openap_baseline')
        print('OK physics.openap_baseline loaded successfully')

        for path in [
            'physics/build_featured_dataset.py',
            'physics/enrich_featured_dataset.py',
            'physics/enrich_v3_features.py',
        ]:
            py_compile.compile(path, doraise=True)
            print(f'OK {path} syntax valid')
        "
    
    - name: Summary
      run: |
        echo "CI/CD Pipeline completed successfully!"
        echo "The project is ready for use. To run locally:"
        echo "1. Use Python ${{ env.PYTHON_VERSION }}"
        echo "2. Run: pip install -r requirements.txt"
        echo "3. Run the scripts under physics/ or notebooks/ for experiments"
