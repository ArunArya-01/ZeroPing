[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerotwin"
version = "2.0.0"
description = "Physics-informed hybrid ML for aircraft fuel-burn prediction"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AeroTwin Team"}]
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=16.0.0",
    "huggingface_hub>=0.23.0",
    "fsspec>=2024.3.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "openap>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aerotwin*"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
