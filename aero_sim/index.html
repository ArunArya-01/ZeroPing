<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AeroSim — Flight Fuel-Burn Simulator</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #cesiumContainer {
        position: absolute;
        inset: 0;
      }
      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        background: rgba(10, 14, 22, 0.85);
        color: #e8eef7;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 13px;
        min-width: 240px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(4px);
      }
      #hud h1 {
        font-size: 15px;
        margin: 0 0 8px;
        letter-spacing: 0.5px;
      }
      #hud .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin: 3px 0;
      }
      #hud .row span:first-child {
        color: #93a4bc;
      }
      #hud .sep {
        border-top: 1px solid #2a3648;
        margin: 8px 0;
      }
      #fuelGaugeWrap {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        width: 240px;
        height: 260px;
        border-radius: 10px;
        overflow: hidden;
        background: rgba(10, 14, 22, 0.85);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      }
      #fuelGaugeWrap canvas {
        display: block;
      }
      #fuelLabel {
        position: absolute;
        bottom: 6px;
        left: 0;
        right: 0;
        text-align: center;
        color: #e8eef7;
        font-size: 12px;
        text-shadow: 0 1px 2px #000;
      }
      #legend {
        position: absolute;
        bottom: 12px;
        left: 12px;
        z-index: 10;
        background: rgba(10, 14, 22, 0.85);
        color: #e8eef7;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12px;
        backdrop-filter: blur(4px);
      }
      #legend div {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.green {
        background: #3ddc84;
      }
      .dot.red {
        background: #ff5252;
      }
      .dot.orange {
        background: #ffa726;
      }
      .dot.blue {
        background: #42a5f5;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <div id="hud">
      <h1>AeroSim · Fuel-Burn Flight</h1>
      <div class="row"><span>Route</span><span id="hudRoute">—</span></div>
      <div class="row"><span>Aircraft</span><span id="hudAircraft">—</span></div>
      <div class="row"><span>Progress</span><span id="hudProgress">0%</span></div>
      <div class="sep"></div>
      <div class="row"><span>Fuel used</span><span id="hudFuelUsed">0 kg</span></div>
      <div class="row"><span>Fuel remaining</span><span id="hudFuelRemaining">—</span></div>
      <div class="row"><span>Prediction engine</span><span id="hudEngine">—</span></div>
      <div class="row"><span>Distance</span><span id="hudDistance">—</span></div>
    </div>

    <div id="fuelGaugeWrap">
      <canvas id="fuelCanvas"></canvas>
      <div id="fuelLabel">Fuel Remaining</div>
    </div>

    <div id="legend">
      <div><span class="dot green"></span>Low burn segment</div>
      <div><span class="dot orange"></span>Medium burn segment</div>
      <div><span class="dot red"></span>High burn segment</div>
      <div><span class="dot blue"></span>Aircraft</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
