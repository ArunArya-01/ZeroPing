<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AeroSim — Flight Fuel-Burn Simulator</title>
    <style>
      /* ---------- Design tokens ---------- */
      :root {
        --bg-deep: #05070d;
        --bg-grad: radial-gradient(1200px 800px at 70% 10%, rgba(66, 165, 245, 0.12), transparent 60%),
          radial-gradient(900px 700px at 15% 90%, rgba(70, 215, 160, 0.08), transparent 55%);

        --panel: rgba(16, 24, 40, 0.72);
        --panel-solid: rgba(16, 24, 40, 0.92);
        --panel-border: rgba(120, 160, 220, 0.16);
        --panel-border-strong: rgba(120, 160, 220, 0.32);

        --text: #e3ecf7;
        --text-dim: #93a5c0;
        --muted: #64748f;
        --accent: #46d7a0;
        --accent-soft: rgba(70, 215, 160, 0.16);
        --blue: #42a5f5;
        --warn: #ffa726;
        --danger: #ff5252;

        --radius: 16px;
        --radius-sm: 10px;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
        --blur: blur(14px) saturate(150%);
        --inset: 18px;
        --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--font);
        color: var(--text);
        background: var(--bg-grad), var(--bg-deep);
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- Glass panel ---------- */
      .glass {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
      }

      .panel-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.4px;
        color: var(--muted);
        margin-bottom: 10px;
      }

      /* ---------- Cesium ---------- */
      #cesiumContainer {
        position: fixed;
        inset: 0;
        background: var(--bg-deep);
      }
      .cesium-widget-credits {
        opacity: 0.5;
        font-size: 10px;
      }

      /* ================= LEFT RAIL ================= */
      #leftRail {
        position: fixed;
        top: var(--inset);
        left: var(--inset);
        z-index: 30;
        width: 300px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* Flight header */
      #flightHeader {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: linear-gradient(135deg, rgba(70, 215, 160, 0.16), rgba(66, 165, 245, 0.12));
        border-bottom: 1px solid var(--panel-border);
        border-radius: var(--radius) var(--radius) 0 0;
      }
      #logo {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--blue));
        color: #05140d;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.5px;
        flex-shrink: 0;
        box-shadow: 0 4px 16px rgba(70, 215, 160, 0.35);
      }
      #flightTitle {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      #hudEngine.subtitle {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 1px;
      }

      /* Route picker */
      #routePicker {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #routeSelect {
        width: 100%;
        padding: 10px 12px;
        background: rgba(8, 12, 22, 0.6);
        color: var(--text);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-family: inherit;
        outline: none;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      #routeSelect:hover,
      #routeSelect:focus {
        border-color: var(--panel-border-strong);
      }

      .route-pair {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .route-pair .city {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .route-pair .city.right {
        text-align: right;
        align-items: flex-end;
      }
      .route-pair .code {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .route-pair .name {
        font-size: 10px;
        color: var(--text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 90px;
      }
      .route-line {
        flex: 1;
        height: 2px;
        background: linear-gradient(90deg, var(--blue), var(--accent));
        position: relative;
      }
      .route-line::before,
      .route-line::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        transform: translateY(-50%);
        background: var(--blue);
        box-shadow: 0 0 8px rgba(66, 165, 245, 0.6);
      }
      .route-line::before {
        left: 0;
        background: var(--blue);
      }
      .route-line::after {
        right: 0;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(70, 215, 160, 0.6);
      }

      /* Stats grid */
      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 14px 16px;
        border-top: 1px solid var(--panel-border);
      }
      .stat {
        padding: 9px 11px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        transition: border-color 0.15s;
      }
      .stat:hover {
        border-color: var(--panel-border);
      }
      .stat .label {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.9px;
        color: var(--muted);
      }
      .stat .value {
        font-size: 16px;
        font-weight: 700;
        margin-top: 3px;
        color: var(--text);
        white-space: nowrap;
      }
      .stat .unit {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
      }

      /* ================= RIGHT RAIL ================= */
      #rightRail {
        position: fixed;
        top: var(--inset);
        right: var(--inset);
        z-index: 30;
        width: 216px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* Fuel panel */
      #fuelPanel {
        padding: 16px;
        text-align: center;
      }
      #fuelGaugeWrap {
        position: relative;
        width: 100%;
        height: 168px;
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: radial-gradient(circle at 50% 38%, rgba(66, 165, 245, 0.1), transparent 72%);
      }
      #fuelGaugeWrap canvas {
        display: block;
        margin: 0 auto;
      }
      #fuelPct {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.5px;
        margin-top: 6px;
        transition: color 0.4s;
      }
      #fuelPct span {
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
      }
      .fuel-sub {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--panel-border);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
      }
      .fuel-sub b {
        display: block;
        margin-top: 2px;
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0;
      }

      /* Legend */
      #legend {
        padding: 14px 16px;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 0;
        font-size: 12px;
        color: var(--text-dim);
      }
      .dot {
        width: 11px;
        height: 11px;
        border-radius: 4px;
        flex-shrink: 0;
      }
      .dot.green {
        background: var(--accent);
        box-shadow: 0 0 8px rgba(70, 215, 160, 0.5);
      }
      .dot.orange {
        background: var(--warn);
      }
      .dot.red {
        background: var(--danger);
      }
      .dot.blue {
        background: var(--blue);
      }

      /* ================= TOP CENTER: camera ================= */
      #cameraMode {
        position: fixed;
        top: var(--inset);
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        display: flex;
        gap: 2px;
        padding: 4px;
      }
      #cameraMode .cn-btn {
        padding: 8px 18px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-dim);
        font-size: 12px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s;
      }
      #cameraMode .cn-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
      }
      #cameraMode .cn-btn.active {
        background: var(--accent-soft);
        border-color: rgba(70, 215, 160, 0.5);
        color: var(--accent);
      }

      /* ================= BOTTOM BAR ================= */
      #bottomBar {
        position: fixed;
        bottom: var(--inset);
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        width: min(620px, calc(100vw - var(--inset) * 2 - 60px));
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 12px 18px;
      }

      /* Progress */
      #progressBlock {
        flex: 1;
        min-width: 0;
      }
      #progressTop {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 7px;
        font-size: 11px;
        color: var(--muted);
      }
      #progressTop .value {
        font-size: 14px;
        font-weight: 800;
        color: var(--accent);
      }
      #progressBarTrack {
        height: 7px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
        position: relative;
      }
      #progressBarFill {
        height: 100%;
        width: 0%;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--blue), var(--accent));
        position: relative;
        transition: width 0.15s linear;
      }
      #progressBarFill::after {
        content: '';
        position: absolute;
        right: 0;
        top: 0;
        height: 100%;
        width: 14px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6));
        border-radius: 6px;
      }

      /* Transport controls */
      #transport {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ctrl-btn {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        border: 1px solid var(--panel-border);
        border-radius: 9px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.15s;
      }
      .ctrl-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--panel-border-strong);
      }
      .ctrl-btn.active {
        background: var(--accent-soft);
        border-color: rgba(70, 215, 160, 0.5);
        color: var(--accent);
      }
      .speed {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .speed b {
        color: var(--text);
        font-size: 13px;
        min-width: 30px;
        text-align: center;
        font-weight: 700;
      }

      /* ---------- Responsive ---------- */
      @media (max-width: 860px) {
        :root {
          --inset: 10px;
        }
        #leftRail,
        #rightRail {
          width: 250px;
        }
        #cameraMode {
          display: none;
        }
        #bottomBar {
          width: calc(100vw - var(--inset) * 2);
        }
        .route-pair .name {
          max-width: 60px;
        }
      }

      @media (max-width: 640px) {
        #rightRail {
          top: auto;
          bottom: 80px;
          width: 170px;
          gap: 10px;
        }
        #fuelGaugeWrap {
          height: 120px;
        }
        #legend {
          display: none;
        }
        .stat-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <!-- Top center: camera mode -->
    <div id="cameraMode" class="glass">
      <button class="cn-btn" data-cam="follow">Follow</button>
      <button class="cn-btn active" data-cam="overview">Overview</button>
    </div>

    <!-- Left rail: flight card -->
    <aside id="leftRail">
      <section class="glass">
        <div id="flightHeader">
          <div id="logo">AS</div>
          <div>
            <div id="flightTitle">AeroSim</div>
            <div id="hudEngine" class="subtitle">—</div>
          </div>
        </div>

        <div id="routePicker">
          <select id="routeSelect"></select>

          <div class="route-pair">
            <div class="city">
              <span class="code" id="hudOrigin">—</span>
              <span class="name" id="hudOriginName">—</span>
            </div>
            <div class="route-line"></div>
            <div class="city right">
              <span class="code" id="hudDest">—</span>
              <span class="name" id="hudDestName">—</span>
            </div>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat">
            <div class="label">Aircraft</div>
            <div class="value" id="hudAircraft">—</div>
          </div>
          <div class="stat">
            <div class="label">Distance</div>
            <div class="value" id="hudDistance">—</div>
          </div>
          <div class="stat">
            <div class="label">Elapsed</div>
            <div class="value" id="hudElapsed">00:00:00</div>
          </div>
          <div class="stat">
            <div class="label">Fuel Used</div>
            <div class="value" id="hudFuelUsed"><span class="unit">0</span> kg</div>
          </div>
        </div>
      </section>
    </aside>

    <!-- Right rail: fuel gauge + legend -->
    <aside id="rightRail" class="glass">
      <section id="fuelPanel">
        <div class="panel-label">Fuel Remaining</div>
        <div id="fuelGaugeWrap"></div>
        <div id="fuelPct">100<span>%</span></div>
        <div class="fuel-sub">
          <span>Left<b id="hudFuelRemaining">—</b></span>
          <span>Total<b id="hudFuelTotal">—</b></span>
        </div>
      </section>

      <section id="legend">
        <div class="panel-label">Segment Burn</div>
        <div class="legend-row"><span class="dot green"></span>Low burn</div>
        <div class="legend-row"><span class="dot orange"></span>Medium burn</div>
        <div class="legend-row"><span class="dot red"></span>High burn</div>
        <div class="legend-row"><span class="dot blue"></span>Aircraft</div>
      </section>
    </aside>

    <!-- Bottom bar: progress + transport -->
    <div id="bottomBar" class="glass">
      <div id="progressBlock">
        <div id="progressTop">
          <span>Flight Progress</span>
          <span class="value" id="hudProgress">0%</span>
        </div>
        <div id="progressBarTrack">
          <div id="progressBarFill"></div>
        </div>
      </div>

      <div id="transport">
        <button class="ctrl-btn active" id="btnPause" title="Pause / Play">⏸</button>
        <span class="speed">×<b id="speedLabel">100</b></span>
        <button class="ctrl-btn" id="speedDown" title="Slower">−</button>
        <button class="ctrl-btn" id="speedUp" title="Faster">+</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
